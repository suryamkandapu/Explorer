name: Deploy Frontend

on:
  push:
    branches: [ main ]
    paths:
      - 'Frontend/**'

jobs:
  deploy-frontend:
    runs-on: [ self-hosted ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install & Build Frontend
        run: |
          cd Frontend
          npm install
          npm run build
          sudo systemctl reload nginx